[package]
name = "evolutionary"
version = "0.3.0"
edition = "2021"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]
homepage = "https://github.com/IgorFroehner/evolutionary"
readme = "README.md"
description = "A fully extensible Rust framework for using parallelized genetic algorithms to solve problems."
repository = "https://github.com/IgorFroehner/evolutionary"
keywords = ["framework", "genetic", "optimization", "evolutionary", "search"]
categories = ["algorithms", "science"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.9.2"
rand_chacha = "0.9"
toml = { version = "0.8.2", optional = true }
serde = { version = "1.0.136", optional = true }
serde_derive = { version = "1.0.183", optional = true }
rayon = "1.7"
dyn-clone = "1.0.13"
plotters = { version = "0.3.5", optional = true }
rand_distr = "0.5"

[dev-dependencies]
# Only for the xor example: library users never pull it in.
only-brain = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0"

[features]
default = []
# Reads evolution parameters from a TOML file: `config_read`.
config = ["dep:toml", "serde"]
# `Serialize` and `Deserialize` for the built-in individuals and `GeneCod`.
serde = ["dep:serde", "dep:serde_derive"]
# Fitness charts: `Evolution::plot_chart`, and the chart saved by `ExperimentRunner`.
plot = ["dep:plotters"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "math_func"
path = "examples/math_func/main.rs"
required-features = ["config"]

[[example]]
name = "nqueens"
path = "examples/nqueens/main.rs"
required-features = ["config", "plot"]

[[example]]
name = "nqueens_valued"
path = "examples/nqueens_valued/main.rs"
required-features = ["config"]

[[example]]
name = "radios"
path = "examples/radios/main.rs"
required-features = ["config"]

[[example]]
name = "party"
path = "examples/party/main.rs"
required-features = ["plot"]

[[example]]
name = "tsp"
path = "examples/tsp/main.rs"
required-features = ["plot"]

[[bench]]
name = "real_at_scale"
harness = false
