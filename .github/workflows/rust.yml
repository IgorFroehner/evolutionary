name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Install system dependencies
      # plotters needs fontconfig to render charts.
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with every feature
      run: cargo test --verbose --all-features
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Docs
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings

  msrv:
    # The library on the oldest Rust it supports: `rust-version` in Cargo.toml.
    name: MSRV (1.82)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        # Keep in sync with `rust-version` in Cargo.toml.
        toolchain: "1.82"
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    - name: Check the library with every feature
      # Only the library: the dev-dependencies (criterion, only-brain) need Rust 1.85, so the
      # tests, examples and benchmark cannot build here. --locked checks the versions the
      # lockfile pins, so no resolver setting applies here. If a dependency bump breaks this
      # job, regenerate the lockfile with an MSRV-aware resolve (cargo 1.84 or later):
      #   CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update
      # .cargo/config.toml sets the same thing for every `cargo update` in this repository.
      # Cargo 1.82 does not know that setting and prints a warning that it is ignored.
      run: cargo check --locked --verbose --all-features
